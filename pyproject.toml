[project]
name = "haddock-cx-copilot"
version = "0.1.0"
description = "CX support triage copilot: classify, investigate, draft, human review. Traced and evaluated with Langfuse."
authors = [
    { name = "pablomv", email = "morvegpablo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "langfuse>=4.16.0",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[typesafe]>=2.54.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
