<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cola · haddock CX copilot{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body data-next="{{ next_id or '' }}" data-prev="{{ prev_id or '' }}">
  <div class="shell {% block shell_class %}{% endblock %}">
    <nav class="rail" aria-label="Principal">
      <span class="mark" aria-hidden="true">h</span>
      <a href="/" {% if active == "queue" or not active or active is undefined %}aria-current="page"{% endif %} title="Cola">
        <i data-lucide="inbox"></i><span class="sr-only">Cola</span>
        {% if pending %}<span class="count">{{ pending }}</span>{% endif %}
      </a>
      <a href="/metrics" {% if active == "metrics" %}aria-current="page"{% endif %} title="Impacto">
        <i data-lucide="chart-no-axes-column"></i><span class="sr-only">Impacto</span>
      </a>
      <a href="/presentacion" {% if active == "presentacion" %}aria-current="page"{% endif %} title="Presentación">
        <i data-lucide="presentation"></i><span class="sr-only">Presentación</span>
      </a>
      <a href="/codigo" {% if active == "codigo" %}aria-current="page"{% endif %} title="Código">
        <i data-lucide="code-xml"></i><span class="sr-only">Código</span>
      </a>
      <a href="/intro" {% if active == "intro" %}aria-current="page"{% endif %} title="Introducción">
        <i data-lucide="circle-help"></i><span class="sr-only">Introducción</span>
      </a>
    </nav>
    {% block queue %}{% include "_queue.html" %}{% endblock %}
    {% block main %}{% endblock %}
  </div>
</body>
</html>
